# Render Blueprint for Libya FPL App
# https://render.com/docs/blueprint-spec

databases:
  - name: libyafpl-db
    databaseName: libyafpl
    user: libyafpl_user
    plan: free  # Change to 'starter' for paid tier

services:
  - type: web
    name: libyafpl
    env: python
    plan: free  # Change to 'starter' for paid tier
    buildCommand: pip install -r requirements.txt
    # Must match Procfile. These pages are I/O-bound — a cold request spends
    # ~85% of its time waiting on the FPL API, not on CPU — so threads buy
    # concurrency almost for free on a single core. Without --threads, two
    # sync workers means only two requests in flight, each parked ~5s.
    # The longer timeout covers a cold request that also triggers a backfill,
    # which measured ~30s locally and would lose against gunicorn's 30s default.
    startCommand: gunicorn app:app --timeout 120 --workers 2 --threads 4
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: libyafpl-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      # FPL Authentication - ADD THESE MANUALLY IN RENDER DASHBOARD
      - key: FPL_SESSION_ID
        sync: false  # Must be set manually in Render dashboard
      - key: FPL_CSRF_TOKEN
        sync: false  # Must be set manually in Render dashboard
